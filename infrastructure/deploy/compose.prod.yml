# Single-server deployment (free tier: Oracle Cloud Always Free VM, arm64 or amd64).
# Caddy terminates HTTPS and routes /api/* to FastAPI, everything else to Next.js.
# Media lives in Cloudflare R2 (S3 API); voice runs through LiveKit Cloud + Gemini Live.
#
# Usage (on the server, from the repository root):
#   cp infrastructure/deploy/env.production.example infrastructure/deploy/.env   # then fill it in
#   docker compose -f infrastructure/deploy/compose.prod.yml --env-file infrastructure/deploy/.env up -d --build
#
# Only Caddy publishes ports (80/443). PostgreSQL, Redis and the internal events API stay private.

name: ielts-master-prod

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql://${POSTGRES_USER:-ielts}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ielts}
  REDIS_URL: redis://redis:6379/0
  PUBLIC_APP_URL: https://${DOMAIN:?set DOMAIN}
  CSRF_TRUSTED_ORIGINS: '["https://${DOMAIN}"]'
  AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?set AUTH_SECRET_KEY}
  STAFF_MFA_REQUIRED: ${STAFF_MFA_REQUIRED:-}
  MEDIA_UPLOADS_ENABLED: ${MEDIA_UPLOADS_ENABLED:-true}
  REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
  REGISTRATION_MINIMUM_AGE: ${REGISTRATION_MINIMUM_AGE:-16}
  LEGAL_TERMS_VERSION: ${LEGAL_TERMS_VERSION:-}
  LEGAL_PRIVACY_VERSION: ${LEGAL_PRIVACY_VERSION:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
  EMAIL_FROM: ${EMAIL_FROM:-}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?set S3_ENDPOINT_URL (Cloudflare R2)}
  S3_PUBLIC_ENDPOINT_URL: ${S3_ENDPOINT_URL}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
  S3_BUCKET: ${S3_BUCKET:-ielts-media}
  S3_REGION: auto
  GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
  LIVEKIT_URL: ${LIVEKIT_URL:?set LIVEKIT_URL}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
  SPEAKING_EVENTS_TOKEN: ${SPEAKING_EVENTS_TOKEN:?set SPEAKING_EVENTS_TOKEN}

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ielts}
      POSTGRES_DB: ${POSTGRES_DB:-ielts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.2.3-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: &backend-build
      context: ../..
      dockerfile: infrastructure/docker/backend.Dockerfile
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ielts}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ielts}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: *backend-build
    environment:
      <<: *app-env
      # Requests arrive from Caddy on the private Docker network.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Outbox worker: emails + Writing/Speaking AI evaluations.
  worker:
    build: *backend-build
    command: ["python", "-m", "app.workers.outbox"]
    environment: *app-env
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
    environment:
      API_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # AI Speaking examiner (LiveKit Agents worker). Talks to LiveKit Cloud and Gemini outbound;
  # posts transcript events to the backend over the private network.
  voice:
    build:
      context: ../..
      dockerfile: infrastructure/docker/voice.Dockerfile
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-3.8-live}
      CANDIDATE_STT: ${CANDIDATE_STT:-deepgram/nova-3}
      EXAMINER_SILENCE_MS: ${EXAMINER_SILENCE_MS:-1500}
      BACKEND_INTERNAL_URL: http://backend:8000
      SPEAKING_EVENTS_TOKEN: ${SPEAKING_EVENTS_TOKEN}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
