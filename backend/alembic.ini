# Alembic configuration — single linear migration history (docs/DATABASE_SCHEMA.md §10).
# The database URL is NOT stored here: migrations/env.py reads DATABASE_URL from the environment.
#
#   uv run --env-file .env alembic -c backend/alembic.ini upgrade head
#   uv run --env-file .env alembic -c backend/alembic.ini revision -m "add_x" --rev-id 0002

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Files: <YYYYMMDD>_<rev>_<slug>.py ; revision IDs are sequential 4-digit numbers (0001, 0002, ...)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
