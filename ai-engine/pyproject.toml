[project]
name = "ielts-ai"
version = "0.1.0"
description = "IELTS MASTER 2.0 AI engine — pure library: provider interfaces, prompts, LangGraph workflows (ADR-003)"
requires-python = ">=3.14,<3.15"
# Deliberately minimal. LangChain/LangGraph and provider SDKs are added in Phase 8 when first used.
dependencies = [
    "httpx>=0.28",              # provider REST adapters (Gemini)
    "pydantic>=2.12",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ielts_ai"
module-root = ""
