[project]
name = "ielts-voice"
version = "0.1.0"
description = "IELTS MASTER 2.0 voice engine — LiveKit Agents runtime, deployed independently (ADR-004)"
requires-python = ">=3.14,<3.15"
# Talks to the backend over HTTP only (ADR-004).
dependencies = [
    "httpx>=0.28",
    "ielts-ai",
    "livekit-agents[google]>=1.8,<2",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ielts_voice"
module-root = ""

[tool.uv.sources]
ielts-ai = { workspace = true }
